<!DOCTYPE html>
<html>
<head>
  <title>Scan History</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      background: #f5f5f5;
      width: 320px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .item {
      background: white;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      word-break: break-all;
    }

    .safe {
      border-left: 5px solid green;
    }

    .suspicious {
      border-left: 5px solid orange;
    }

    .danger {
      border-left: 5px solid red;
    }

    .time {
      font-size: 12px;
      color: gray;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h2>Scan History</h2>
  <div id="historyList">Loading...</div>

  <script src="history.js"></script>
</body>
</html>
